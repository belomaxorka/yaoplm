# YAOPL: the YAOPLM author's fork of OPL (ADR-0018), pre-release `latest`
# recreated on every push to `master` with the nightly build. Releases are
# tagged `yaopl-vX.Y.Z`, candidates `yaopl-vX.Y.Z-rcN` (pre-releases). Release
# name = version string; the CI publishes SHA256SUMS next to the assets
# (research/16 §2, research/17 §6, ADR-0051).
id = "yaopl"
family = "opl"
name = "YAOPL"
publisher = "fork"
repo = "yaopl/yaopl"
profile = "opl-1.2"
recommended = false
devices = ["usb", "mx4sio"]

[license]
spdx = "AFL-3.0"
url = "https://github.com/yaopl/yaopl/blob/master/LICENSE"
authors = "belomaxorka, on top of ps2homebrew and the Open PS2 Loader contributors"

[summary]
en = "The same 1.2.0 beta with the YAOPLM author’s fixes."
ru = "Та же бета 1.2.0 с исправлениями автора YAOPLM."

[limits]
en = "Unofficial build."
ru = "Неофициальная сборка."

[[docs]]
kind = "fork"
url = "https://github.com/yaopl/yaopl/blob/master/CHANGELOG.md"

[[docs]]
kind = "readme"
url = "https://github.com/yaopl/yaopl/blob/master/README.md"

[[docs]]
kind = "wiki"
url = "https://github.com/ps2homebrew/Open-PS2-Loader/wiki"

[channel]
tag = "latest"
floating = true
prerelease = true
releases = ["latest", "yaopl-v*"]
version = "name"
elf = "OPNPS2LD.ELF"
languages = "OPNPS2LD-LANGS-{version}.7z"
checksums = { digest = true, sums = "SHA256SUMS" }

[layout]
folders = ["CFG", "THM", "LNG", "ART", "VMC", "CHT", "APPS", "CD", "DVD"]
settings = "conf_opl.cfg"
settings_location = "memory-card"
seed = ["usb_mode", "language_text"]
languages = "LNG"
defaults = { usb = "fmcb", mx4sio = "app" }

[[layout.presets]]
id = "fmcb"
path = "UPDT/OPL.ELF"
devices = ["usb"]
launchers = ["fmcb"]

[[layout.presets]]
id = "ps2bbl"
path = "APPS/OPNPS2LD.ELF"
devices = ["usb"]
launchers = ["ps2bbl"]

[[layout.presets]]
id = "app"
path = "APPS/YAOPL/OPNPS2LD.ELF"
title = "YAOPL"
devices = ["usb", "mx4sio"]
launchers = ["opl-apps", "ps2bbl-mx4sio", "osdmenu"]

# `-yaopl` ends YAOPL's version (`LOCALVERSION`), `-nosio2man` may follow it:
# `v1.2.0-Beta-<N>-<commit>-yaopl` before YAOPL numbered its own versions,
# then `v2.0.0-nightly.<N>-<commit>-yaopl`, `v2.0.0-rc1-yaopl`, `v2.0.0-yaopl`.
[fingerprints]
elf = ["OPNPS2LD*.ELF", "OPL.ELF"]
settings = ["conf_opl.cfg"]
versions = ["v*"]
suffix = "yaopl"
