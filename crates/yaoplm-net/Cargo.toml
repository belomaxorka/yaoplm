[package]
name = "yaoplm-net"
description = "Picture sources, download cache, rate limits, PNG transcoding and the Redump DAT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crc32fast.workspace = true
fast_image_resize = { version = "6.1.0", features = ["image"] }
image.workspace = true
flate2.workspace = true
percent-encoding = "2.3.2"
quick-xml.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "fs", "io-util"] }
yaoplm-formats.workspace = true
yaoplm-hash.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
