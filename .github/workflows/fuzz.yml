name: Fuzz

# cargo-fuzz needs nightly and minutes; run weekly and on demand (ADR-0011).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "180"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo-fuzz (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECONDS_PER_TARGET: ${{ inputs.seconds || '180' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml) and nightly
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked
      - name: Seed the ISO corpus with fixture images
        run: cargo run -p yaoplm-test-support --example write_fixtures -- fuzz/corpus/iso
      - name: Run targets
        working-directory: fuzz
        run: |
          for target in iso system_cnf cfg ul_cfg zso cht tar ps2_elf cue memcard ps1mc sd2psx_ini; do
            echo "::group::$target"
            dict=()
            if [ -f "dict/$target.dict" ]; then dict=(-dict="dict/$target.dict"); fi
            # -a: overflow checks; with -O alone an overflow wraps silently.
            cargo +nightly fuzz run -O -a "$target" -- -max_total_time="$SECONDS_PER_TARGET" -max_len=65536 "${dict[@]}"
            echo "::endgroup::"
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 30
