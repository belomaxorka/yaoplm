name: Loader hashes

# Floating release tags (`latest`) replace their assets in place, so the
# hashes of each build are written down while they are published: once a day
# scripts/loader-hashes.py appends new builds of every floating catalogue
# channel to data/loader-hashes/ (SPEC §5.10.1, ADR-0022, ADR-0040). It reads
# the Releases API and the small checksum files only, never a build. A push
# made with GITHUB_TOKEN starts no other workflow.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loader-hashes
  cancel-in-progress: false

jobs:
  append:
    name: Append new builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Ask the Releases API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/loader-hashes.py
      - name: The files still read
        run: python3 scripts/loader-hashes.py --check
      - name: Commit what was appended
        run: |
          if git diff --quiet -- data/loader-hashes; then
            echo "No new builds."
            exit 0
          fi
          git diff -- data/loader-hashes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loader-hashes
          git commit -m "chore(data): new loader builds in the hash history (LDR-2)"
          git push
