name: CI

# Docs-only changes skip CI: three-OS runs cost private-repo minutes (ADR-0011).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  NODE_VERSION: 26
  COREPACK_VERSION: 0.36.0

jobs:
  checks:
    name: Format, core deps, TS bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Core crates do not depend on tauri, axum or tokio (ADR-0003)
        run: scripts/check-core-deps.sh
      - name: Generated TS types match the Rust API
        run: |
          cargo test -p yaoplm-api --features ts-export
          if [ -n "$(git status --porcelain -- web/src/api/generated)" ]; then
            git status --short -- web/src/api/generated
            echo "::error::web/src/api/generated is stale. Run: cargo test -p yaoplm-api --features ts-export"
            exit 1
          fi

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The first uncached Windows build takes ~12 min; a hung step must not burn hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  oracles:
    name: OPL cross-checks (USBA_crc32 in C, ziso.py), fuzz targets build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # OPL is AFL-3.0: its files are fetched at test time, never committed
      # (ADR-0002). Bump together with docs/research/02-opl-formats.md.
      OPL_COMMIT: b3a2199795fe89ba7e2dd7b843354472dff2c3eb
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Fetch OPL src/system.c and pc/ziso.py
        run: |
          mkdir -p "$RUNNER_TEMP/opl/src" "$RUNNER_TEMP/opl/pc"
          base="https://raw.githubusercontent.com/ps2homebrew/Open-PS2-Loader/$OPL_COMMIT"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opl/src/system.c" "$base/src/system.c"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opl/pc/ziso.py" "$base/pc/ziso.py"
      - name: Python with lz4 for ziso.py
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet lz4==4.4.5
      - name: Cross-check against OPL's own code
        env:
          YAOPLM_OPL_SRC: ${{ runner.temp }}/opl
          YAOPLM_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: cargo test -p yaoplm-formats --test opl_oracles -- --ignored
      - name: Fuzz targets compile (they run weekly in fuzz.yml)
        run: cargo check --manifest-path fuzz/Cargo.toml

  real-fs:
    name: Imports onto loop-mounted FAT32 and exFAT images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install mkfs.vfat and mkfs.exfat
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 dosfstools exfatprogs
      # Image files only, never a real drive (CLAUDE.md rule 1). /mnt is the
      # runner's large scratch disk; the 4.3 GB test game needs the room.
      - name: Create and mount the images
        run: |
          # Azure runner kernels ship the exfat driver in linux-modules-extra.
          sudo modprobe exfat 2>/dev/null || {
            sudo apt-get install -y -q --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe exfat
          }
          sudo truncate -s 6G /mnt/fat32.img /mnt/exfat.img
          sudo mkfs.vfat -F 32 -s 64 -n YAOPLM /mnt/fat32.img
          sudo mkfs.exfat -L YAOPLM /mnt/exfat.img
          sudo mkdir -p /mnt/fat32 /mnt/exfat
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" /mnt/fat32.img /mnt/fat32
          sudo mount -o loop,uid="$(id -u)",gid="$(id -g)" /mnt/exfat.img /mnt/exfat
      - name: Import, split, rename and delete on the real drivers
        env:
          YAOPLM_FAT32_DIR: /mnt/fat32
          YAOPLM_EXFAT_DIR: /mnt/exfat
        run: cargo test -p yaoplm-core --test real_fs -- --ignored --nocapture
      - name: Check the images with fsck
        if: ${{ !cancelled() }}
        run: |
          sudo umount /mnt/fat32 /mnt/exfat
          sudo fsck.vfat -n /mnt/fat32.img
          sudo fsck.exfat -n /mnt/exfat.img

  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm via corepack
        run: |
          npm install -g corepack@${COREPACK_VERSION}
          corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build

  e2e:
    name: E2E (Playwright vs yaoplm-server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm via corepack
        run: |
          npm install -g corepack@${COREPACK_VERSION}
          corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web build
      - run: cargo build -p yaoplm-server
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: pnpm -C web e2e
      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
