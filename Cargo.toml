[workspace]
resolver = "3"
members = [
    "crates/yaoplm-core",
    "crates/yaoplm-formats",
    "crates/yaoplm-hash",
    "crates/yaoplm-i18n",
    "crates/yaoplm-device",
    "crates/yaoplm-net",
    "crates/yaoplm-api",
    "crates/yaoplm-test-support",
    "apps/cli",
    "apps/server",
    "apps/desktop/src-tauri",
]
# cargo-fuzz targets need nightly; see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/belomaxorka/yaoplm"
publish = false

[workspace.dependencies]
yaoplm-api = { path = "crates/yaoplm-api" }
yaoplm-core = { path = "crates/yaoplm-core" }
yaoplm-device = { path = "crates/yaoplm-device" }
yaoplm-formats = { path = "crates/yaoplm-formats" }
yaoplm-hash = { path = "crates/yaoplm-hash" }
yaoplm-i18n = { path = "crates/yaoplm-i18n" }
yaoplm-net = { path = "crates/yaoplm-net" }
yaoplm-test-support = { path = "crates/yaoplm-test-support" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
cc = "1.9.0"
chd = "0.4.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
dirs = "7.0.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
md-5 = "0.11.0"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
proptest = "1.12.0"
quick-xml = "0.42.0"
rustix = { version = "1.1.5", features = ["fs"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24.1", default-features = false }
sha1 = "0.11.0"
tempfile = "3.27.0"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
windows-sys = "0.61.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma", "xz"] }

# Multi-gigabyte generated fixtures stay fast in debug test runs.
[profile.dev.package.yaoplm-test-support]
opt-level = 3

# Hashing gigabytes in tests and debug builds (GAME-5).
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
